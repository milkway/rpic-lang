# Standalone package (own [workspace]) so the main native workspace doesn't
# depend on PyO3/Python. Build wheels with maturin.
[package]
name = "rpic-python"
version = "0.18.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["André Leite <leite@de.ufpe.br>"]

[lib]
# the native extension lives at `rpic._native`; `python/rpic/` wraps it
name = "_native"
crate-type = ["cdylib"]

[dependencies]
rpic-core = { path = "../../crates/core" }
rpic-render = { path = "../../crates/render" }
geopic-core = { path = "../../crates/geopic-core" }
serde_json = "1.0.154"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }

[workspace]
