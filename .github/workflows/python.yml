name: Python

on:
  push:
    tags: ["v*"]
  # re-publish path: a tag's run uses the workflow AS OF THE TAG, so a fix
  # like this one needs a manual dispatch from main (checkout picks up the
  # dispatched ref — run it only when main is at the release commit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: build
          args: --release --out dist
          # Linux: build in the manylinux_2_28 container. The bare runner
          # moved to ubuntu26, whose glibc is newer than any manylinux tag
          # maturin knows — host builds now produce `linux_x86_64` wheels
          # that PyPI rejects (this silently broke the v0.12.0 upload).
          manylinux: 2_28
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: bindings/python/dist/*

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: bindings/python/dist/*

  publish:
    name: publish to PyPI + release
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Attach wheels to the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # tolerate re-runs where some files already made it up
          skip-existing: true
        # NOTE: no continue-on-error — it masked the v0.12.0 upload failure
        # behind a green job. A PyPI rejection must fail the workflow.
