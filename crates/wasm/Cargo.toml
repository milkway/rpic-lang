# Standalone package (its own [workspace]) so the main native workspace stays
# lean. Build with: wasm-pack build crates/wasm --target web --out-dir ../../web/pkg
[package]
name = "rpic-wasm"
description = "WASM bindings for rpic: compile pic source to an SVG + animation-manifest JSON bundle in the browser."
version = "0.19.0"
edition = "2024"
license = "BSD-2-Clause"
authors = ["André Leite <leite@de.ufpe.br>"]

[lib]
crate-type = ["cdylib"]

[features]
# Opt-in `texlabels` math renderer (RaTeX via rpic-render, rasterizer left
# out). Off by default: the math build ships as a second, lazily fetched npm
# artifact so nobody pays its size unless they use `$…$` labels.
math = ["dep:rpic-render"]
# Opt-in geopic (`compile_geo` / `geo_to_canvas`: drawing → GeoJSON). Off by
# default for the same reason as `math`: it adds ~180 KB to the module, so it
# ships as a third, lazily fetched npm artifact (`rpic_wasm_geo`; DECISIONS.md G8).
geo = ["dep:geopic-core", "dep:serde", "dep:serde_json"]

[dependencies]
rpic-core = { path = "../core" }
rpic-render = { path = "../render", default-features = false, features = ["math"], optional = true }
wasm-bindgen = "0.2"
# `geo` feature: serde/serde_json are already in the tree through rpic-core
# and geopic-core; here they parse the options JSON and assemble the result.
geopic-core = { path = "../geopic-core", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[profile.release]
opt-level = "z"
lto = true

[workspace]

# wasm-opt was never enabled for this package (#403): the scene emitter grew
# the lean artifact past the ≤5% release budget, and -Oz claws it back for
# both builds (wasm-pack downloads binaryen when this is set).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
